name: Update
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - name: Bump API versions
        id: bump
        run: |
          BUMP=$(go run internal/bump/bump.go)
          echo "Changes: $BUMP"
          echo "changes=$BUMP" >> $GITHUB_OUTPUT
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          go generate ./...
        shell: bash
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          title: "feat: ${{ steps.bump.outputs.changes }}"
